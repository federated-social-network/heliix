services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-heliix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heliix_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-heliix}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heliix}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fsn-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PGSSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./fsn-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
